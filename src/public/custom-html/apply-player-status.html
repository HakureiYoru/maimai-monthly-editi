<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报名选手状态</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      padding: 8px;
      background: transparent;
    }

    .container {
      width: 100%;
      height: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: grid;
      grid-template-columns: 1.4fr 1fr 0.8fr 0.9fr;
      gap: 8px;
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .card-header span {
      text-align: center;
    }

    .card-header span:first-child {
      text-align: left;
    }

    .card-body {
      flex: 1;
      padding: 4px 18px;
      min-height: 88px;
      overflow-y: auto;
      scrollbar-color: rgba(255, 255, 255, 0.45) transparent;
      scrollbar-width: thin;
    }

    .card-body::-webkit-scrollbar {
      width: 7px;
    }

    .card-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 999px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 0.8fr 0.9fr;
      gap: 8px;
      width: 100%;
      align-items: center;
      min-height: 76px;
      padding: 10px 0;
      position: relative;
    }

    .player-row + .player-row::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.16);
    }

    .player-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .player-cell.identity {
      justify-content: flex-start;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    .name-block {
      min-width: 0;
    }

    .player-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-sub {
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .stat-value {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
    }

    .stat-sub {
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .badge.yes {
      color: #fff;
      background: rgba(46, 204, 113, 0.35);
      border-color: rgba(46, 204, 113, 0.55);
    }

    .badge.no {
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .mobile-label {
      display: none;
    }

    @media (max-width: 560px) {
      .card-header,
      .player-row {
        grid-template-columns: 1fr;
      }

      .card-header span,
      .player-cell,
      .stat-value,
      .stat-sub {
        text-align: left;
        justify-content: flex-start;
      }

      .card-header {
        gap: 4px;
      }

      .card-header span:not(:first-child) {
        display: none;
      }

      .player-row {
        gap: 14px;
      }

      .mobile-label {
        display: inline;
        margin-right: 8px;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.55);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <div class="card-header">
        <span>参赛者</span>
        <span>报名ID</span>
        <span>往届排名</span>
        <span>是否为 Qualified</span>
      </div>
      <div class="card-body" id="cardBody">
        <div class="loading-state">
          <div class="spinner"></div>
          <span>加载中...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PHOTO = "https://static.wixstatic.com/media/daf9ba_fb0143f9208d4e059c81d6f4e7855256~mv2.jpg";
    const cardBody = document.getElementById('cardBody');

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showLoading() {
      cardBody.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <span>加载中...</span>
        </div>
      `;
    }

    function showMessage(message) {
      cardBody.innerHTML = `<div class="state">${escapeHtml(message)}</div>`;
    }

    function createPlayerRow(data) {
      const name = data.displayName || '未知用户';
      const registrationId = data.registrationId || '未填写';
      const photo = (typeof data.photo === 'string' && data.photo) ? data.photo : DEFAULT_PHOTO;
      const hasRank = Number.isFinite(data.rank) && data.rank > 0;
      const totalPp = Number.isFinite(data.totalPp) ? data.totalPp : 0;
      const isQualified = data.isQualified === true;

      const rankMain = hasRank ? `#${data.rank}` : '暂无';
      const rankSub = hasRank
        ? `总分 ${totalPp}`
        : '未进入天梯';

      const row = document.createElement('div');
      row.className = 'player-row';
      row.innerHTML = `
          <div class="player-cell identity">
            <img class="avatar" src="${escapeHtml(photo)}" alt="${escapeHtml(name)}" />
            <div class="name-block">
              <div class="player-name">${escapeHtml(name)}</div>
              <div class="player-sub">已报名</div>
            </div>
          </div>
          <div class="player-cell">
            <span class="mobile-label">报名ID</span>
            <div class="stat-value">${escapeHtml(registrationId)}</div>
          </div>
          <div class="player-cell" style="flex-direction:column;align-items:center;">
            <span class="mobile-label">往届排名</span>
            <div class="stat-value">${escapeHtml(rankMain)}</div>
            <div class="stat-sub">${escapeHtml(rankSub)}</div>
          </div>
          <div class="player-cell">
            <span class="mobile-label">Qualified</span>
            <span class="badge ${isQualified ? 'yes' : 'no'}">${isQualified ? 'Yes' : 'No'}</span>
          </div>
      `;

      const avatarImg = row.querySelector('.avatar');
      if (avatarImg) {
        avatarImg.addEventListener('error', () => {
          if (avatarImg.src === DEFAULT_PHOTO) return;
          avatarImg.src = DEFAULT_PHOTO;
        });
      }
      return row;
    }

    function renderPlayers(players) {
      const list = Array.isArray(players) ? players : [];
      if (list.length === 0) {
        showMessage('暂无报名记录');
        return;
      }

      const fragment = document.createDocumentFragment();
      list.forEach(player => fragment.appendChild(createPlayerRow(player)));
      cardBody.replaceChildren(fragment);
      cardBody.scrollTop = 0;
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || !data.type) return;

      if (data.type === 'APPLY_STATUS_LOADING') {
        showLoading();
        return;
      }

      if (data.type === 'APPLY_STATUS_MESSAGE') {
        showMessage(data.message || '暂无信息');
        return;
      }

      if (data.type === 'APPLY_STATUS_DATA') {
        renderPlayers(data.players || []);
      }
    });
  </script>
</body>
</html>
