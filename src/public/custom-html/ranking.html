<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      padding: 20px;
      background: transparent;
    }

    .container {
      width: 100%;
      height: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* 毛玻璃卡片 */
    .glass-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 28px;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title .count-badge {
      font-size: 13px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 2px 12px;
      color: rgba(255, 255, 255, 0.9);
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
      position: absolute;
      top: 22px;
      right: 28px;
    }

    .page-button {
      min-width: 76px;
      padding: 7px 14px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .page-button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.3);
    }

    .page-button:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .page-info {
      min-width: 72px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .pagination {
        position: static;
        margin-bottom: 12px;
      }
    }

    /* 排名列表 */
    .ranking-list {
      display: block;
      flex: 1 1 0;
      height: 0;
      min-height: 0;
      overflow: hidden;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 4px;
      width: 100%;
      min-height: 72px;
      transition: background 0.2s ease, transform 0.2s ease;
      position: relative;
    }

    .ranking-item + .ranking-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50px;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.05) 80%, transparent);
    }

    .ranking-item:hover {
      transform: translateX(4px);
    }

    /* 前三名特殊样式（仅文字色调，无外框） */
    .ranking-item.rank-1 { }
    .ranking-item.rank-2 { }
    .ranking-item.rank-3 { }

    /* 名次数字 */
    .rank-number {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.85);
    }

    .rank-1 .rank-number {
      background: rgba(255, 215, 0, 0.2);
      color: #ffe566;
      font-size: 16px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.4), inset 0 0 8px rgba(255, 215, 0, 0.2);
      border: 1px solid rgba(255, 215, 0, 0.6);
      animation: glow-gold 2s ease-in-out infinite;
    }

    .rank-2 .rank-number {
      background: rgba(192, 192, 192, 0.2);
      color: #e0e0e0;
      font-size: 16px;
      box-shadow: 0 0 10px rgba(200, 200, 200, 0.6), 0 0 20px rgba(200, 200, 200, 0.3), inset 0 0 8px rgba(200, 200, 200, 0.15);
      border: 1px solid rgba(200, 200, 200, 0.5);
      animation: glow-silver 2s ease-in-out infinite;
    }

    .rank-3 .rank-number {
      background: rgba(205, 127, 50, 0.2);
      color: #e8a96a;
      font-size: 16px;
      box-shadow: 0 0 10px rgba(205, 127, 50, 0.6), 0 0 20px rgba(205, 127, 50, 0.3), inset 0 0 8px rgba(205, 127, 50, 0.15);
      border: 1px solid rgba(205, 127, 50, 0.5);
      animation: glow-bronze 2s ease-in-out infinite;
    }

    @keyframes glow-gold {
      0%, 100% { box-shadow: 0 0 8px rgba(255, 215, 0, 0.6), 0 0 18px rgba(255, 215, 0, 0.3); }
      50%       { box-shadow: 0 0 14px rgba(255, 215, 0, 0.9), 0 0 28px rgba(255, 215, 0, 0.5); }
    }

    @keyframes glow-silver {
      0%, 100% { box-shadow: 0 0 8px rgba(200, 200, 200, 0.5), 0 0 18px rgba(200, 200, 200, 0.25); }
      50%       { box-shadow: 0 0 14px rgba(200, 200, 200, 0.8), 0 0 28px rgba(200, 200, 200, 0.4); }
    }

    @keyframes glow-bronze {
      0%, 100% { box-shadow: 0 0 8px rgba(205, 127, 50, 0.5), 0 0 18px rgba(205, 127, 50, 0.25); }
      50%       { box-shadow: 0 0 14px rgba(205, 127, 50, 0.8), 0 0 28px rgba(205, 127, 50, 0.4); }
    }

    /* 头像 */
    .avatar-wrap {
      flex-shrink: 0;
      display: flex;
    }

    .avatar-wrap a {
      display: flex;
      border-radius: 50%;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .avatar-wrap a:hover {
      opacity: 0.8;
      transform: scale(1.08);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.15);
    }

    /* 用户信息 */
    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    /* 总分 */
    .total-pp {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      text-align: right;
    }

    .total-pp .pp-label {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      display: block;
      text-align: right;
    }

    /* 加载态 */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 40px 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <div class="section-title">
        排行榜
        <span class="count-badge" id="countBadge" style="display:none"></span>
      </div>

      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <span>加载中...</span>
      </div>

      <div id="pagination" class="pagination" style="display:none">
        <button id="previousPage" class="page-button" type="button">上一页</button>
        <span id="pageInfo" class="page-info"></span>
        <button id="nextPage" class="page-button" type="button">下一页</button>
      </div>

      <div id="rankingList" class="ranking-list" style="display:none"></div>

      <div id="emptyState" class="empty-state" style="display:none">暂无排名数据</div>
    </div>
  </div>

  <script>
    const DEFAULT_PHOTO = "https://static.wixstatic.com/media/daf9ba_fb0143f9208d4e059c81d6f4e7855256~mv2.jpg";

    const loadingEl = document.getElementById('loadingState');
    const listEl = document.getElementById('rankingList');
    const emptyEl = document.getElementById('emptyState');
    const countEl = document.getElementById('countBadge');
    const paginationEl = document.getElementById('pagination');
    const previousPageEl = document.getElementById('previousPage');
    const nextPageEl = document.getElementById('nextPage');
    const pageInfoEl = document.getElementById('pageInfo');

    const PAGE_SIZE = 25;
    let rankingMembers = [];
    let currentPage = 1;

    function getRankClass(rank) {
      if (rank === 1) return 'rank-1';
      if (rank === 2) return 'rank-2';
      if (rank === 3) return 'rank-3';
      return '';
    }

    function getRankIcon(rank) {
      return rank;
    }

    function createRankingItem(member) {
      const itemEl = document.createElement('div');
      itemEl.className = `ranking-item ${getRankClass(member.rank)}`;

      const rankEl = document.createElement('div');
      rankEl.className = 'rank-number';
      rankEl.textContent = String(getRankIcon(member.rank));

      const avatarWrapEl = document.createElement('div');
      avatarWrapEl.className = 'avatar-wrap';

      const avatarEl = document.createElement('img');
      avatarEl.className = 'avatar';
      avatarEl.src = typeof member.photo === 'string' && member.photo
        ? member.photo
        : DEFAULT_PHOTO;
      avatarEl.alt = String(member.title || '用户');
      avatarEl.addEventListener('error', () => {
        if (avatarEl.src === DEFAULT_PHOTO) return;
        avatarEl.src = DEFAULT_PHOTO;
      });

      if (typeof member.website === 'string' && member.website) {
        const linkEl = document.createElement('a');
        linkEl.href = member.website;
        linkEl.target = '_blank';
        linkEl.rel = 'noopener noreferrer';
        linkEl.appendChild(avatarEl);
        avatarWrapEl.appendChild(linkEl);
      } else {
        avatarWrapEl.appendChild(avatarEl);
      }

      const userInfoEl = document.createElement('div');
      userInfoEl.className = 'user-info';

      const userNameEl = document.createElement('div');
      userNameEl.className = 'user-name';
      userNameEl.textContent = String(member.title || '未知用户');

      const userSubEl = document.createElement('div');
      userSubEl.className = 'user-sub';
      userSubEl.textContent = `排名 #${member.rank}`;

      userInfoEl.append(userNameEl, userSubEl);

      const totalPpEl = document.createElement('div');
      totalPpEl.className = 'total-pp';
      totalPpEl.appendChild(document.createTextNode(String(member.totalPp ?? 0)));

      const ppLabelEl = document.createElement('span');
      ppLabelEl.className = 'pp-label';
      ppLabelEl.textContent = '总分';
      totalPpEl.appendChild(ppLabelEl);

      itemEl.append(rankEl, avatarWrapEl, userInfoEl, totalPpEl);
      return itemEl;
    }

    function renderCurrentPage() {
      const totalPages = Math.ceil(rankingMembers.length / PAGE_SIZE);
      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const pageMembers = rankingMembers.slice(startIndex, startIndex + PAGE_SIZE);

      const pageFragment = document.createDocumentFragment();
      pageMembers.forEach(member => {
        pageFragment.appendChild(createRankingItem(member));
      });
      listEl.replaceChildren(pageFragment);

      listEl.style.display = 'block';
      paginationEl.style.display = totalPages > 1 ? 'flex' : 'none';
      pageInfoEl.textContent = `${currentPage} / ${totalPages}`;
      previousPageEl.disabled = currentPage === 1;
      nextPageEl.disabled = currentPage === totalPages;
      listEl.scrollTop = 0;
    }

    function renderRanking(members) {
      loadingEl.style.display = 'none';
      rankingMembers = Array.isArray(members) ? members : [];
      currentPage = 1;

      if (rankingMembers.length === 0) {
        emptyEl.style.display = 'block';
        paginationEl.style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      countEl.textContent = `共 ${rankingMembers.length} 人 · 每页 ${PAGE_SIZE} 人`;
      countEl.style.display = 'inline-block';
      renderCurrentPage();
    }

    previousPageEl.addEventListener('click', () => {
      if (currentPage <= 1) return;
      currentPage -= 1;
      renderCurrentPage();
    });

    nextPageEl.addEventListener('click', () => {
      const totalPages = Math.ceil(rankingMembers.length / PAGE_SIZE);
      if (currentPage >= totalPages) return;
      currentPage += 1;
      renderCurrentPage();
    });

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || !data.type) return;

      if (data.type === 'RANKING_DATA') {
        renderRanking(data.members);
      }

      if (data.type === 'RANKING_LOADING') {
        loadingEl.style.display = 'flex';
        listEl.style.display = 'none';
        emptyEl.style.display = 'none';
        countEl.style.display = 'none';
        paginationEl.style.display = 'none';
      }
    });
  </script>
</body>
</html>
